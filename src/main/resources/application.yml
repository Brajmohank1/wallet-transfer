spring:
  application:
    name: wallet-transfer
  datasource:
    url: jdbc:postgresql://localhost:5432/wallet
    username: wallet
    password: wallet
    hikari:
      maximum-pool-size: 10
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 50
      min-spare: 10

management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        health: healthz
        prometheus: metrics
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  structured:
    format:
      console: logstash
